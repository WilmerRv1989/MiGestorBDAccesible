# La aplicación WPF se compila y prueba en Windows; el núcleo, las pruebas
# y las herramientas también se comprueban en macOS, incluida la exportación
# del manual. El checkout no guarda el token en .git/config y cada acción
# está fijada por el SHA completo de su commit.
name: compilacion

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar y probar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Compilar y probar
        shell: pwsh
        run: |
          dotnet build MiGestorBDAccesible.sln --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test MiGestorBDAccesible.sln --no-build --nologo
          exit $LASTEXITCODE

  compilar-macos:
    name: Compilar y probar en macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Compilar, probar y exportar el manual
        shell: bash
        run: |
          set -euo pipefail
          dotnet build MiGestorBDAccesible.Core --nologo
          dotnet build MiGestorBDAccesible.Pruebas --nologo
          dotnet test MiGestorBDAccesible.Pruebas --no-build --nologo
          dotnet build MiGestorBDAccesible.Herramientas --nologo
          dotnet run --project MiGestorBDAccesible.Herramientas -- exportar-manual "$RUNNER_TEMP/manual.html"
          test -s "$RUNNER_TEMP/manual.html"
